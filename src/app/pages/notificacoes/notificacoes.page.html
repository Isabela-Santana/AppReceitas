<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/home" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>
      Notificações
      <ion-badge *ngIf="unreadCount > 0" class="title-badge">{{ unreadCount }}</ion-badge>
    </ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="markAllAsRead()" [disabled]="unreadCount === 0" class="mark-all-btn">
        <ion-icon slot="icon-only" name="checkmark-done-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="notifications-content">

  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content
      pullingIcon="chevron-down-circle-outline"
      pullingText="Puxe para atualizar"
      refreshingSpinner="crescent"
      refreshingText="Atualizando...">
    </ion-refresher-content>
  </ion-refresher>

  <!-- Filtros -->
  <div class="filter-tabs">
    <button
      class="filter-btn"
      [class.active]="activeFilter === 'todas'"
      (click)="setFilter('todas')">
      Todas
    </button>
    <button
      class="filter-btn"
      [class.active]="activeFilter === 'nao_lidas'"
      (click)="setFilter('nao_lidas')">
      Não lidas
      <span class="filter-count" *ngIf="unreadCount > 0">{{ unreadCount }}</span>
    </button>
  </div>

  <!-- Skeleton loading -->
  <div *ngIf="isLoading" class="skeleton-list">
    <div class="skeleton-item" *ngFor="let i of [1,2,3,4,5]">
      <ion-skeleton-text animated class="skeleton-avatar"></ion-skeleton-text>
      <div class="skeleton-content">
        <ion-skeleton-text animated style="width: 60%; height: 14px; border-radius: 6px;"></ion-skeleton-text>
        <ion-skeleton-text animated style="width: 90%; height: 12px; border-radius: 6px; margin-top: 6px;"></ion-skeleton-text>
        <ion-skeleton-text animated style="width: 30%; height: 10px; border-radius: 6px; margin-top: 6px;"></ion-skeleton-text>
      </div>
    </div>
  </div>

  <!-- Lista de notificações -->
  <ion-list *ngIf="!isLoading && filteredNotifications.length > 0" lines="none" class="notifications-list">
    <ng-container *ngFor="let notification of filteredNotifications">
      <ion-item-sliding>
        <ion-item
          class="notification-item"
          [class.unread]="!notification.read"
          (click)="markAsRead(notification)"
          button>

          <!-- Unread indicator -->
          <div class="unread-dot" *ngIf="!notification.read"></div>

          <!-- Avatar com ícone do tipo -->
          <div class="avatar-wrapper" slot="start">
            <div class="user-avatar" [style.background]="getColorForType(notification.type)">
              {{ notification.userAvatar }}
            </div>
            <div class="type-icon" [style.background]="getColorForType(notification.type)">
              <ion-icon [name]="getIconForType(notification.type)"></ion-icon>
            </div>
          </div>

          <!-- Conteúdo -->
          <ion-label class="notification-label">
            <p class="notification-text">
              <span class="user-name">{{ notification.user }}</span>
              {{ notification.message }}
              <span class="recipe-name" *ngIf="notification.recipeTitle"> "{{ notification.recipeTitle }}"</span>
            </p>
            <ion-note class="notification-time">{{ notification.time }} atrás</ion-note>
          </ion-label>

          <!-- Imagem da receita -->
          <div class="recipe-thumbnail" slot="end" *ngIf="notification.recipeTitle">
            <div class="thumb-placeholder">🍰</div>
          </div>

        </ion-item>

        <!-- Swipe para deletar -->
        <ion-item-options side="end">
          <ion-item-option color="danger" (click)="deleteNotification(notification.id)" expandable>
            <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
          </ion-item-option>
        </ion-item-options>
      </ion-item-sliding>
    </ng-container>
  </ion-list>

  <!-- ✅ Empty state FORA do ion-list -->
  <div class="empty-state" *ngIf="!isLoading && filteredNotifications.length === 0">
    <div class="empty-icon">🔔</div>
    <h3>Nenhuma notificação</h3>
    <p>Você está em dia! Quando alguém interagir com suas receitas, você verá aqui.</p>
  </div>

</ion-content>
