<!-- src/app/pages/login/login.page.html -->

<!--Tela de lOGIN-->>

<ion-content [fullscreen]="true" class="login-content">

  <div class="login-hero">
    <div class="logo-wrapper">
      <div class="logo-icon">
        <ion-icon name="restaurant-outline"></ion-icon>
      </div>
      <h1 class="logo-title">Receitas</h1>
      <p class="logo-sub">Da Nona</p>
    </div>
    <p class="hero-tagline">Compartilhe, descubra e<br>salve receitas incríveis.</p>
    <div class="wave-divider">
      <svg viewBox="0 0 375 48" preserveAspectRatio="none">
        <path d="M0,48 Q94,0 188,32 Q282,64 375,16 L375,48 Z" fill="#FAF5EF"/>
      </svg>
    </div>
  </div>

  <div class="login-form-area">
    <form [formGroup]="loginForm" (ngSubmit)="onLogin()">

      <div class="input-group">
        <ion-icon name="mail-outline" class="input-icon"></ion-icon>
        <ion-input formControlName="email" type="email"
          placeholder="Digite seu email" class="custom-input">
        </ion-input>
      </div>
      <div class="error-msg"
        *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
        Email inválido.
      </div>

      <div class="input-group">
        <ion-icon name="lock-closed-outline" class="input-icon"></ion-icon>
        <ion-input formControlName="password"
          [type]="showPassword ? 'text' : 'password'"
          placeholder="Digite sua senha" class="custom-input">
        </ion-input>
        <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"
          class="input-icon-right" (click)="togglePassword()">
        </ion-icon>
      </div>
      <div class="error-msg"
        *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
        Mínimo de 6 caracteres.
      </div>

      <ion-button expand="block" class="btn-vinho btn-login"
        type="submit" [disabled]="loginForm.invalid || loading">
        <ion-spinner *ngIf="loading" name="crescent" slot="start"></ion-spinner>
        {{ loading ? 'Entrando...' : 'Entrar' }}
      </ion-button>

    </form>

    <ion-button fill="clear" class="forgot-btn" (click)="onForgotPassword()">
      Esqueceu a senha?
    </ion-button>

    <div class="divider">
      <div class="divider-line"></div>
      <span>ou</span>
      <div class="divider-line"></div>
    </div>

    <ion-button expand="block" class="btn-outline-vinho" routerLink="/register">
      Criar Conta
    </ion-button>

    <p class="footer-login">
      Não tem conta? <span class="link-vinho" routerLink="/register">Criar Conta</span>
    </p>
  </div>

</ion-content>
