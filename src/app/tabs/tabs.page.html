<!-- src/app/tabs/tabs.page.html -->
<ion-tabs>
  <ion-tab-bar slot="bottom" class="custom-tab-bar">

    <ion-tab-button tab="home" href="/tabs/home">
      <ion-icon name="home-outline"></ion-icon>
      <ion-label>Início</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="busca" href="/tabs/busca">
      <ion-icon name="search-outline"></ion-icon>
      <ion-label>Buscar</ion-label>
    </ion-tab-button>

    <!-- Botão + central -->
    <ion-tab-button tab="nova-receita" href="/tabs/nova-receita" class="tab-center-btn">
      <div class="center-fab">
        <ion-icon name="add"></ion-icon>
      </div>
    </ion-tab-button>

    <ion-tab-button tab="curtidas" href="/tabs/curtidas">
      <ion-icon name="heart-outline"></ion-icon>
      <ion-label>Curtidas</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="perfil" href="/tabs/perfil">
      <ion-icon name="person-outline"></ion-icon>
      <ion-label>Perfil</ion-label>
    </ion-tab-button>

  </ion-tab-bar>
</ion-tabs>
